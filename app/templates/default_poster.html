<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;background:#090d0e;color:#f8f4e8;font-family:Arial,Helvetica,sans-serif}.poster{width:100%;max-width:900px;min-height:1125px;margin:auto;background:#0b1011;overflow:hidden}.mast{padding:35px 42px 26px;background:linear-gradient(115deg,#06090a,#22231f 58%,#080b0c);border-bottom:3px solid #c7a45a}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-size:11px;letter-spacing:.28em;font-weight:900;color:#e7c779}.status{border:1px solid #c7a45a;color:#e7c779;font-size:9px;letter-spacing:.15em;font-weight:900;padding:9px 12px}.title{font-size:clamp(42px,7.5vw,78px);line-height:.9;letter-spacing:-.055em;font-weight:900;text-transform:uppercase;margin:22px 0 8px;overflow-wrap:anywhere}.subtitle{font-size:20px;color:#ddc17d;font-weight:700;margin:0}.tagline{display:inline-block;margin-top:17px;padding:9px 13px;background:#c7a45a;color:#131410;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero{height:420px;margin:0;position:relative;background:linear-gradient(135deg,#38403d,#111718);overflow:hidden}.hero img,.tile img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}.hero img[src=""],.tile img[src=""]{display:none}.image-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#dfc47777;font-size:10px;font-weight:900;letter-spacing:.2em}.offer{margin:0 38px;padding:20px 5px;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #9e8148}.offer small{font-size:9px;color:#c8a75e;letter-spacing:.2em;font-weight:900}.price{font-size:38px;font-weight:900;margin-top:5px}.offer-note{font-size:12px;color:#b7b8af;text-align:right;max-width:250px;line-height:1.5}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:22px 38px 25px}.tile{height:160px;position:relative;background:linear-gradient(135deg,#38403d,#111718);overflow:hidden;border:1px solid #b79652}.caption{padding-top:8px;color:#d4ba79;font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.specs{display:grid;grid-template-columns:repeat(4,1fr);margin:0 38px 25px;background:#171d1d;border:1px solid #937642}.spec{padding:16px 7px;text-align:center;border-right:1px solid #ffffff1a}.spec:last-child{border:0}.spec small{display:block;color:#b7a16f;font-size:8px;letter-spacing:.17em;font-weight:900;margin-bottom:7px}.spec b{font-size:12px}.footer{margin:0 38px;padding:19px 0 34px;border-top:1px solid #937642;display:flex;justify-content:space-between;align-items:center;gap:14px}.footer strong{color:#e7c779;font-size:15px}.footer span{font-size:10px;color:#a4a99f;text-align:right}@media print{.poster{max-width:none;width:210mm;min-height:297mm}}@media(max-width:560px){.mast{padding-left:23px;padding-right:23px}.hero{height:300px}.offer,.gallery,.specs,.footer{margin-left:22px;margin-right:22px}.title{font-size:45px}.tile{height:125px}.spec{padding:12px 3px}.spec b{font-size:10px}}
</style></head><body><main class="poster">
<header class="mast"><div class="topline"><div class="brand">MIDNIGHT MOTORS</div><div class="status">PREMIUM LISTING</div></div><h1 class="title">{{title1}}</h1><p class="subtitle">{{title2}}</p><div class="tagline">{{tagline}}</div></header>
<section class="hero"><div class="image-empty">ADD YOUR MAIN VEHICLE PHOTO</div><img src="{{image1}}" alt=""></section>
<div class="offer"><div><small>ASKING PRICE</small><div class="price">{{price}}</div></div><div class="offer-note">{{condition}}</div></div>
<section class="gallery"><div><div class="tile"><div class="image-empty">PHOTO TWO</div><img src="{{image2}}" alt=""></div><div class="caption">{{caption2}}</div></div><div><div class="tile"><div class="image-empty">PHOTO THREE</div><img src="{{image3}}" alt=""></div><div class="caption">{{caption3}}</div></div></section>
<section class="specs"><div class="spec"><small>YEAR</small><b>{{year}}</b></div><div class="spec"><small>FUEL</small><b>{{fuel}}</b></div><div class="spec"><small>TRANSMISSION</small><b>{{transmission}}</b></div><div class="spec"><small>ODOMETER</small><b>{{odometer}}</b></div></section>
<footer class="footer"><strong>{{contact}}</strong><span>{{seller}}</span></footer>
</main></body></html>
