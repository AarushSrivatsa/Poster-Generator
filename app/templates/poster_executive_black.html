<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;background:#ddd6c7;color:#f8f4ea;font-family:Georgia,'Times New Roman',serif}.poster{width:100%;max-width:900px;min-height:1125px;margin:auto;background:#151512;overflow:hidden}.masthead{text-align:center;padding:40px 48px 23px;border-bottom:1px solid #ad925c}.brand{font:900 10px Arial,sans-serif;letter-spacing:.35em;color:#d9bd80}.line{width:42px;height:2px;background:#d9bd80;margin:17px auto}.title{font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.04em;text-transform:uppercase;margin:0;font-weight:700;overflow-wrap:anywhere}.subtitle{font:600 15px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#d0c4a8;margin:14px 0 0}.hero{position:relative;height:420px;margin:28px 38px 0;background:linear-gradient(135deg,#4c4b43,#171815);overflow:hidden}.hero img,.tile img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}.hero img[src=""],.tile img[src=""]{display:none}.image-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#d9bd8077;font:900 10px Arial,sans-serif;letter-spacing:.22em}.offer{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;margin:24px 38px;padding:16px 0;border-top:1px solid #ad925c;border-bottom:1px solid #ad925c}.offer small{font:900 9px Arial,sans-serif;color:#d9bd80;letter-spacing:.2em}.price{font-size:37px;font-weight:700;margin-top:4px}.tagline{font:italic 14px/1.5 Georgia,serif;color:#d0c4a8;text-align:right;max-width:280px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0 38px 28px}.tile{height:160px;position:relative;overflow:hidden;background:linear-gradient(135deg,#4c4b43,#171815)}.caption{font:900 9px Arial,sans-serif;color:#d9bd80;letter-spacing:.16em;text-transform:uppercase;padding-top:7px}.specs{display:grid;grid-template-columns:repeat(4,1fr);margin:0 38px 25px;background:#24241e}.spec{padding:17px 6px;text-align:center;border-right:1px solid #d9bd8030}.spec:last-child{border:0}.spec small{display:block;font:900 8px Arial,sans-serif;color:#b6a47c;letter-spacing:.16em;margin-bottom:7px}.spec b{font:700 12px Arial,sans-serif}.footer{margin:0 38px;padding:20px 0 35px;border-top:1px solid #ad925c;display:flex;justify-content:space-between;align-items:center;gap:15px}.footer strong{font:700 15px Arial,sans-serif;color:#d9bd80}.footer span{font:italic 11px Georgia,serif;color:#b6ae9e;text-align:right}@media print{.poster{max-width:none;width:210mm;min-height:297mm}}@media(max-width:560px){.masthead{padding-left:22px;padding-right:22px}.hero{margin-left:22px;margin-right:22px;height:300px}.offer,.gallery,.specs,.footer{margin-left:22px;margin-right:22px}.title{font-size:43px}.tile{height:125px}.spec{padding:12px 3px}.spec b{font-size:10px}}
</style></head><body><main class="poster">
<header class="masthead"><div class="brand">THE MOTOR COLLECTION</div><div class="line"></div><h1 class="title">{{title1}}</h1><p class="subtitle">{{title2}}</p></header>
<section class="hero"><div class="image-empty">PLACE YOUR VEHICLE PHOTO</div><img src="{{image1}}" alt=""></section>
<div class="offer"><div><small>EXCLUSIVE OFFER</small><div class="price">{{price}}</div></div><div class="tagline">{{tagline}}</div></div>
<section class="gallery"><div><div class="tile"><div class="image-empty">PHOTO TWO</div><img src="{{image2}}" alt=""></div><div class="caption">{{caption2}}</div></div><div><div class="tile"><div class="image-empty">PHOTO THREE</div><img src="{{image3}}" alt=""></div><div class="caption">{{caption3}}</div></div></section>
<section class="specs"><div class="spec"><small>YEAR</small><b>{{year}}</b></div><div class="spec"><small>FUEL</small><b>{{fuel}}</b></div><div class="spec"><small>GEARBOX</small><b>{{transmission}}</b></div><div class="spec"><small>KM</small><b>{{odometer}}</b></div></section>
<footer class="footer"><strong>{{contact}}</strong><span>{{seller}} · {{condition}}</span></footer>
</main></body></html>
