<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@page{size:A4 portrait;margin:0}*{box-sizing:border-box}body{margin:0;background:#e9e6df;font-family:Arial,Helvetica,sans-serif;color:#17191b}.poster{width:100%;max-width:900px;min-height:1125px;margin:auto;background:#f6f4ef;overflow:hidden}.topline{display:flex;justify-content:space-between;align-items:center;padding:35px 48px 24px;border-bottom:1px solid #c8c6bd}.brand{font-size:13px;font-weight:900;letter-spacing:.2em}.badge{background:#202629;color:#f9f6ed;padding:10px 15px;border-radius:100px;font-size:10px;font-weight:900;letter-spacing:.13em}.intro{padding:38px 48px 28px}.kicker{font-size:11px;color:#9a7a39;font-weight:900;letter-spacing:.22em;text-transform:uppercase}.title{font-size:clamp(40px,7vw,76px);line-height:.94;letter-spacing:-.06em;font-weight:900;margin:12px 0 8px;text-transform:uppercase;overflow-wrap:anywhere}.subtitle{font-size:22px;color:#676967;font-weight:600;margin:0}.hero{margin:0 48px;height:430px;position:relative;background:linear-gradient(135deg,#aeb8b6,#303a3c);overflow:hidden;border-radius:4px}.hero img,.tile img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}.hero img[src=""],.tile img[src=""]{display:none}.image-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#ffffffbb;font-size:12px;letter-spacing:.18em;font-weight:900}.price-row{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:28px 48px;padding:20px 0;border-bottom:1px solid #c8c6bd;border-top:1px solid #c8c6bd}.price-label{font-size:10px;letter-spacing:.16em;color:#777;font-weight:900}.price{font-size:38px;line-height:1.05;font-weight:900}.tagline{max-width:260px;text-align:right;color:#686b68;font-size:13px;line-height:1.5}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0 48px 32px}.tile{height:175px;position:relative;overflow:hidden;background:linear-gradient(135deg,#aeb8b6,#303a3c)}.caption{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;padding-top:8px;color:#5d625f}.specs{display:grid;grid-template-columns:repeat(4,1fr);margin:0 48px 28px;background:#202629;color:#fff}.spec{padding:17px 10px;text-align:center;border-right:1px solid #ffffff22}.spec:last-child{border:0}.spec small{display:block;color:#c4c4bc;font-size:9px;letter-spacing:.12em;margin-bottom:7px}.spec b{font-size:14px}.footer{margin:0 48px;padding:22px 0 35px;border-top:1px solid #c8c6bd;display:flex;justify-content:space-between;align-items:center;gap:16px}.footer strong{font-size:16px}.footer span{font-size:11px;color:#777}@media print{.poster{max-width:none;width:210mm;min-height:297mm}}@media(max-width:560px){.topline,.intro{padding-left:22px;padding-right:22px}.hero{margin:0 22px;height:310px}.price-row,.gallery,.specs,.footer{margin-left:22px;margin-right:22px}.title{font-size:42px}.gallery{gap:8px}.tile{height:125px}.spec{padding:12px 4px}.spec b{font-size:11px}}
</style></head><body><main class="poster">
<div class="topline"><div class="brand">MOTOR / SELECT</div><div class="badge">AVAILABLE NOW</div></div>
<section class="intro"><div class="kicker">A better way to move</div><h1 class="title">{{title1}}</h1><p class="subtitle">{{title2}}</p></section>
<section class="hero"><div class="image-empty">ADD YOUR VEHICLE PHOTOS IN STUDIO</div><img src="{{image1}}" alt=""></section>
<div class="price-row"><div><div class="price-label">ASKING PRICE</div><div class="price">{{price}}</div></div><div class="tagline">{{tagline}}</div></div>
<section class="gallery">
<div><div class="tile"><div class="image-empty">PHOTO 02</div><img src="{{image2}}" alt=""></div><div class="caption">{{caption2}}</div></div>
<div><div class="tile"><div class="image-empty">PHOTO 03</div><img src="{{image3}}" alt=""></div><div class="caption">{{caption3}}</div></div>
</section>
<section class="specs"><div class="spec"><small>YEAR</small><b>{{year}}</b></div><div class="spec"><small>FUEL</small><b>{{fuel}}</b></div><div class="spec"><small>GEARBOX</small><b>{{transmission}}</b></div><div class="spec"><small>DRIVEN</small><b>{{odometer}}</b></div></section>
<footer class="footer"><strong>{{contact}}</strong><span>{{seller}} · {{condition}}</span></footer>
</main></body></html>
